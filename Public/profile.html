<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BALAJI LUDO KING - Profile</title>

  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">👤</div>

      <div>
        <h1>BALAJI LUDO KING</h1>
        <p>Official Gaming</p>
      </div>
    </div>
  </header>


  <main class="profile-page">

    <!-- PROFILE CARD -->
    <section class="profile-card">

      <div class="avatar" id="avatar">
        👤
      </div>

      <h2 id="profileName">Player</h2>

      <p id="profileMobile">Mobile Number</p>

    </section>


    <!-- ACCOUNT INFORMATION -->
    <section class="section-card">

      <h3>Account Information</h3>

      <div class="info-row">
        <span>Name</span>
        <strong id="nameValue">Player</strong>
      </div>

      <div class="info-row">
        <span>Mobile</span>
        <strong id="mobileValue">Not available</strong>
      </div>

      <div class="info-row">
        <span>Player ID</span>
        <strong id="playerId">BLK-000000</strong>
      </div>

    </section>


    <!-- MENU -->
    <section class="section-card">

      <h3>Account</h3>

      <div class="menu-list">

        <button id="walletBtn">
          <span>💰</span>
          <div>
            <strong>Wallet</strong>
            <small>View your wallet</small>
          </div>
        </button>

        <button id="referBtn">
          <span>🎁</span>
          <div>
            <strong>Refer & Earn</strong>
            <small>Invite friends and earn</small>
          </div>
        </button>

        <button id="supportBtn">
          <span>💬</span>
          <div>
            <strong>Support</strong>
            <small>Get help</small>
          </div>
        </button>

      </div>

    </section>


    <!-- LOGOUT -->
    <button id="logoutBtn" class="logout-btn">
      Logout
    </button>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="../home.html">
      <span>⌂</span>
      <small>Home</small>
    </a>

    <a href="../refer/refer.html">
      <span>🎁</span>
      <small>Refer</small>
    </a>

    <a href="../wallet/wallet.html">
      <span>₹</span>
      <small>Wallet</small>
    </a>

    <a href="../support.html">
      <span>💬</span>
      <small>Support</small>
    </a>

    <a href="profile.html" class="active">
      <span>👤</span>
      <small>Profile</small>
    </a>

  </nav>


  <script src="profile.js"></script>

</body>
</html>
