<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BALAJI LUDO KING - Profile</title>

  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">

    <div class="brand">

      <div class="logo">👤</div>

      <div>
        <h1>BALAJI LUDO KING</h1>
        <p>Official Gaming</p>
      </div>

    </div>

  </header>


  <main class="profile-page">

    <!-- PROFILE -->
    <section class="profile-card">

      <div class="avatar" id="avatar">
        👤
      </div>

      <h2 id="profileName">Player</h2>

      <p id="profileMobile">Mobile Number</p>

      <div class="status-badge">
        UNVERIFIED
      </div>

    </section>


    <!-- STATS -->
    <section class="stats-card">

      <div class="stat-box">

        <strong id="battlePlayed">0</strong>

        <span>Battle Played</span>

      </div>

      <div class="stat-divider"></div>

      <div class="stat-box">

        <strong id="coinWon">₹0</strong>

        <span>Coin Won</span>

      </div>

    </section>


    <!-- GENERAL DETAILS -->
    <section class="section-card">

      <h3>General Details</h3>

      <div class="detail-row">

        <div class="detail-icon">
          📱
        </div>

        <div class="detail-content">

          <span>Phone Number</span>

          <strong id="mobileValue">
            Not available
          </strong>

        </div>

      </div>


      <div class="detail-row">

        <div class="detail-icon">
          ✉️
        </div>

        <div class="detail-content">

          <span>Email ID</span>

          <strong id="emailValue">
            Not available
          </strong>

        </div>

      </div>


      <div class="detail-row">

        <div class="detail-icon">
          🆔
        </div>

        <div class="detail-content">

          <span>Player ID</span>

          <strong id="playerId">
            BLK-000000
          </strong>

        </div>

      </div>

    </section>


    <!-- KYC -->
    <section class="section-card">

      <h3>KYC</h3>

      <button
        id="kycBtn"
        class="kyc-row"
        type="button">

        <div class="kyc-icon">
          ✓
        </div>

        <div class="kyc-content">

          <span>KYC Status</span>

          <strong>Complete KYC Verification</strong>

        </div>

        <div class="kyc-arrow">
          ›
        </div>

      </button>

    </section>


    <!-- ACCOUNT MENU -->
    <section class="section-card">

      <h3>Account</h3>

      <div class="menu-list">

        <button
          id="walletBtn"
          type="button">

          <span>💰</span>

          <div>
            <strong>Wallet</strong>
            <small>View your wallet</small>
          </div>

          <b>›</b>

        </button>


        <button
          id="referBtn"
          type="button">

          <span>🎁</span>

          <div>
            <strong>Refer & Earn</strong>
            <small>Invite friends and earn</small>
          </div>

          <b>›</b>

        </button>


        <button
          id="supportBtn"
          type="button">

          <span>💬</span>

          <div>
            <strong>Support</strong>
            <small>Get help</small>
          </div>

          <b>›</b>

        </button>

      </div>

    </section>


    <!-- LOGOUT -->
    <button
      id="logoutBtn"
      class="logout-btn"
      type="button">

      LOGOUT ACCOUNT

    </button>

  </main>


  <!-- EXISTING BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="home.html">
      <span>⌂</span>
      <small>Home</small>
    </a>

    <a href="refer.html">
      <span>🎁</span>
      <small>Refer</small>
    </a>

    <a href="wallet.html">
      <span>💰</span>
      <small>Wallet</small>
    </a>

    <a href="support.html">
      <span>💬</span>
      <small>Support</small>
    </a>

    <a href="profile.html" class="active">
      <span>👤</span>
      <small>Profile</small>
    </a>

  </nav>


  <script src="profile.js"></script>

</body>
</html>
