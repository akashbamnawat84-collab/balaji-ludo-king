<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle - Balaji Ludo King</title>
  <link rel="stylesheet" href="battle.css">
</head>
<body>
<header class="home-header">
  <a href="home.html" style="color:#fff; text-decoration:none; font-weight:900;">← Back</a>
  <div class="logo-text"><b>BALAJI</b><span>BATTLES</span></div>
  <a href="wallet.html" class="wallet-top">💰 ₹<span id="walletBalance">0</span></a>
</header>

<div class="battle-tabs">
  <button class="tab active" onclick="filterBattle('all')">All</button>
  <button class="tab" onclick="filterBattle('10')">₹10</button>
  <button class="tab" onclick="filterBattle('50')">₹50</button>
  <button class="tab" onclick="filterBattle('100')">₹100</button>
  <button class="tab" onclick="filterBattle('500')">₹500</button>
</div>

<div class="section-title"><span>🔥 Open Battles</span><small id="liveCount">LIVE • 324 Playing</small></div>

<div id="battleList">
  <!-- JS se load hoga -->
</div>

<div class="create-box">
  <h3>Apna Battle Banao</h3>
  <p>Amount select karo aur khelna shuru karo</p>
  <div class="amount-grid">
    <button onclick="createBattle(10)">₹10</button>
    <button onclick="createBattle(25)">₹25</button>
    <button onclick="createBattle(50)">₹50</button>
    <button onclick="createBattle(100)">₹100</button>
    <button onclick="createBattle(250)">₹250</button>
    <button onclick="createBattle(500)">₹500</button>
  </div>
</div>

<nav class="bottom-nav">
  <a href="home.html"><span>🏠</span>Home</a>
  <a href="refer.html"><span>👥</span>Refer</a>
  <a href="wallet.html"><span>💰</span>Wallet</a>
  <a href="support.html"><span>💬</span>Support</a>
</nav>

<script src="battle.js"></script>
</body>
</html>
