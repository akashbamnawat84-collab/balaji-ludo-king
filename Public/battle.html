<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#061631">
  <title>Balaji Ludo King - Battle</title>
  <link rel="stylesheet" href="battle.css">
</head>

<body>

<header class="top-header">

  <div class="top-row">

    <a href="home.html" class="back-btn">
      <span class="back-arrow">←</span>
      <span>Back</span>
    </a>

    <div class="logo">
      <div class="logo-crown">👑</div>
      <div>
        <div class="logo-main">BALAJI</div>
        <div class="logo-sub">LUDO KING</div>
      </div>
    </div>

    <div class="online">
      <span></span> Online
    </div>

  </div>

  <div class="arena">

    <div class="arena-text">
      <div class="swords">⚔️</div>

      <div>
        <h1>Battle <b>Arena</b></h1>
        <p>Create or join a 2-player battle</p>
      </div>
    </div>

    <div class="ludo-art">
      <div class="piece red">●</div>
      <div class="piece yellow">●</div>
      <div class="piece green">●</div>
      <div class="piece blue">●</div>
      <div class="dice">⚄</div>
    </div>

  </div>

</header>


<main class="container">


  <!-- WELCOME -->

  <section class="welcome">

    <div class="welcome-photo">
      👑
    </div>

    <div>
      <h2>Welcome to <span>BALAJI LUDO KING</span></h2>

      <p>
        🙏 दोस्तों आपका विश्वास हमारी पहचान है।
        <strong>Enjoy fast and fair demo battles.</strong>
      </p>
    </div>

  </section>


  <!-- CREATE BATTLE -->

  <section class="create-card">

    <div class="create-head">

      <div class="battle-icon">
        ⚔️
      </div>

      <div class="create-title">
        <h2>Create a Battle</h2>
        <p>Choose your demo entry amount</p>
      </div>

      <button id="rulesBtn" class="rules-open">
        📋 Rules
      </button>

    </div>


    <div class="amount-label">
      <span>🪙</span
