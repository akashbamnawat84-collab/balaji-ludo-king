<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Balaji Ludo King - Admin Dashboard</title>

  <link
    rel="stylesheet"
    href="/admin.css">

</head>


<body>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="admin-header">

    <div class="header-inner">

      <div class="brand">

        <div class="brand-icon">
          👑
        </div>

        <div class="brand-text">

          <h1>
            Balaji Ludo King
          </h1>

          <p>
            Admin Dashboard
          </p>

        </div>

      </div>


      <div class="header-actions">

        <button
          type="button"
          id="refreshBtn"
          class="header-btn">

          ↻ Refresh

        </button>


        <button
          type="button"
          id="logoutBtn"
          class="header-btn logout-btn">

          Logout

        </button>

      </div>

    </div>

  </header>



  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="admin-container">


    <!-- ===================================================
         PAGE TITLE
    ==================================================== -->

    <div class="page-title">

      <h2>
        Dashboard
      </h2>

      <p>
        Manage KYC submissions and review player verification.
      </p>

    </div>



    <!-- ===================================================
         MESSAGE
    ==================================================== -->

    <div
      id="message"
      class="message">
    </div>



    <!-- ===================================================
         STATISTICS
    ==================================================== -->

    <section class="stats-grid">


      <!-- Pending -->

      <div class="stat-card">

        <div class="stat-top">

          <div class="stat-title">
            Pending KYC
          </div>

          <div class="stat-icon">
            ⏳
          </div>

        </div>

        <div
          id="pendingCount"
          class="stat-number">

          0

        </div>

      </div>



      <!-- Approved -->

      <div class="stat-card">

        <div class="stat-top">

          <div class="stat-title">
            Approved
          </div>

          <div class="stat-icon">
            ✓
          </div>

        </div>

        <div
          id="approvedCount"
          class="stat-number">

          0

        </div>

      </div>



      <!-- Rejected -->

      <div class="stat-card">

        <div class="stat-top">

          <div class="stat-title">
            Rejected
          </div>

          <div class="stat-icon">
            ✕
          </div>

        </div>

        <div
          id="rejectedCount"
          class="stat-number">

          0

        </div>

      </div>



      <!-- Total -->

      <div class="stat-card">

        <div class="stat-top">

          <div class="stat-title">
            Total KYC
          </div>

          <div class="stat-icon">
            📋
          </div>

        </div>

        <div
          id="totalCount"
          class="stat-number">

          0

        </div>

      </div>


    </section>



    <!-- ===================================================
         PENDING KYC
    ==================================================== -->

    <section class="section">


      <div class="section-header">

        <h2>
          Pending KYC
        </h2>

        <span
          id="pendingBadge"
          class="section-badge">

          Review

        </span>

      </div>


      <div
        id="pendingList"
        class="kyc-list">

        <div class="loading">
          Loading pending KYC...
        </div>

      </div>


    </section>



    <!-- ===================================================
         ALL KYC
    ==================================================== -->

    <section class="section">


      <div class="section-header">

        <h2>
          All KYC Records
        </h2>

        <span class="section-badge">

          History

        </span>

      </div>


      <div
        id="allList"
        class="kyc-list">

        <div class="loading">
          Loading KYC records...
        </div>

      </div>


    </section>


  </main>



  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="/admin.js"></script>


</body>

</html>
