<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room - Balaji Ludo King</title>
<link rel="stylesheet" href="room.css">
</head>
<body>
<header class="home-header">
<a href="battle.html" style="color:#fff; text-decoration:none; font-weight:900;">← Exit</a>
<div class="logo-text"><b id="roomAmount">₹50 BATTLE</b><span>ROOM CODE</span></div>
<div class="wallet-top">⏱️ <span id="timer">05:00</span></div>
</header>

<div class="room-box">
  <h2>🎲 Room Code</h2>
  <div class="code-box">
    <b id="roomCode">BALAJI-8847</b>
    <button onclick="copyCode()">COPY</button>
  </div>
  <p>Ludo King me jao, is code se join karo</p>
</div>

<div class="players">
  <div class="player"><span>👑</span><b id="p1">You</b><small>Joined</small></div>
  <div class="vs">VS</div>
  <div class="player wait"><span>⏳</span><b id="p2">Waiting...</b><small>Opponent</small></div>
</div>

<div class="rules">
  <h4>📜 Rules</h4>
  <p>1. Room code se Ludo King me jao</p>
  <p>2. Game ka result screenshot yahi upload karo</p>
  <p>3. Galat result pe ID block hogi</p>
</div>

<div class="result-btns">
  <button class="win" onclick="submitResult('win')">✓ I Won</button>
  <button class="lose" onclick="submitResult('lose')">✗ I Lost</button>
</div>

<script src="room.js"></script>
</body>
</html>
