<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Balaji Ludo King - Admin Login</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      padding: 30px 24px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
      color: #333;
    }

    .field input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #d9dce3;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      background: #fff;
    }

    .field input:focus {
      border-color: #555;
    }

    .login-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 11px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      min-height: 22px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }

  </style>

</head>


<body>


  <div class="login-box">

    <div class="logo">
      👑 Balaji Ludo King
    </div>

    <div class="subtitle">
      Admin Panel Login
    </div>


    <form id="adminLoginForm">


      <div class="field">

        <label for="adminId">
          Admin ID
        </label>

        <input
          id="adminId"
          type="text"
          placeholder="Enter Admin ID"
          autocomplete="username"
          required>

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Enter Password"
          autocomplete="current-password"
          required>

      </div>


      <button
        id="loginBtn"
        class="login-btn"
        type="submit">

        Login

      </button>


      <div
        id="message"
        class="message">
      </div>


    </form>


    <a
      href="/"
      class="back">

      ← Back to Website

    </a>

  </div>


<script>

const form = document.getElementById("adminLoginForm");
const adminId = document.getElementById("adminId");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");


function showMessage(text, success = false) {

  message.textContent = text;

  if (success) {
    message.style.color = "#16803c";
  } else {
    message.style.color = "#d62828";
  }

}


async function checkExistingLogin() {

  try {

    const response = await fetch(
      "/api/admin/me",
      {
        method: "GET",
        credentials: "same-origin"
      }
    );

    if (response.ok) {

      window.location.replace("/admin.html");

    }

  } catch (error) {

    console.log("Existing session check failed.");

  }

}


form.addEventListener("submit", async function (event) {

  event.preventDefault();


  const id = adminId.value.trim();
  const pass = password.value;


  if (!id || !pass) {

    showMessage("Admin ID और Password डालें।");

    return;

  }


  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  showMessage("");


  try {

    const response = await fetch(
      "/api/admin/login",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        credentials: "same-origin",

        body: JSON.stringify({

          admin_id: id,
          password: pass

        })

      }
    );


    let data = {};

    try {

      data = await response.json();

    } catch (error) {

      data = {};

    }


    if (response.ok && data.success) {

      showMessage(
        "Login successful. Opening Admin Panel...",
        true
      );


      setTimeout(function () {

        window.location.replace("/admin.html");

      }, 500);


      return;

    }


    showMessage(
      data.error ||
      data.message ||
      "Invalid Admin ID or Password."
    );


  } catch (error) {

    console.error(error);

    showMessage(
      "Server connection failed. Please try again."
    );

  }


  loginBtn.disabled = false;
  loginBtn.textContent = "Login";

});


checkExistingLogin();

</script>


</body>

</html>
