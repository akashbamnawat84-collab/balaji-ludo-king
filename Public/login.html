<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#100b18">

  <title>Balaji Ludo King - Login</title>

  <link rel="stylesheet" href="/login/login.css">
</head>

<body>

  <main class="login-page">

    <div class="bg-glow glow-one"></div>
    <div class="bg-glow glow-two"></div>

    <section class="login-card">

      <div class="brand">
        <div class="brand-crown">♛</div>

        <div class="brand-name">
          BALAJI
          <span>LUDO KING</span>
        </div>
      </div>

      <div class="login-heading">
        <span class="step-label">STEP 01</span>
        <h1>LOGIN</h1>
        <p>Enter your mobile number to continue</p>
      </div>

      <!-- MOBILE SECTION -->
      <section id="mobileSection" class="login-section active">

        <label class="field-label">
          Mobile Number
        </label>

        <div class="mobile-input-wrap">

          <div class="country-code">
            <span>🇮🇳</span>
            <strong>+91</strong>
            <span class="arrow">▼</span>
          </div>

          <input
            id="mobileNumber"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="10"
            placeholder="Mobile Number"
            aria-label="Mobile Number"
          >

        </div>

        <div id="msg91-captcha"></div>

        <button
          id="sendOtpBtn"
          class="primary-btn"
          type="button"
        >
          <span id="sendBtnText">SEND OTP</span>
          <span id="sendLoader" class="loader hidden"></span>
        </button>

      </section>


      <!-- OTP SECTION -->
      <section id="otpSection" class="login-section">

        <div class="otp-title">
          <span>OTP SENT TO</span>

          <strong id="maskedMobile">
            +91 XXXXX XXXXX
          </strong>
        </div>

        <label class="field-label">
          Enter OTP
        </label>

        <input
          id="otpInput"
          class="otp-input"
          type="tel"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="••••••"
          aria-label="Enter OTP"
        >

        <button
          id="verifyOtpBtn"
          class="primary-btn"
          type="button"
        >
          <span id="verifyBtnText">
            VERIFY & LOGIN
          </span>

          <span
            id="verifyLoader"
            class="loader hidden"
          ></span>
        </button>

        <button
          id="resendOtpBtn"
          class="secondary-btn"
          type="button"
          disabled
        >
          RESEND OTP
          <span id="resendTimer"></span>
        </button>

        <button
          id="changeNumberBtn"
          class="text-btn"
          type="button"
        >
          ← Change Mobile Number
        </button>

      </section>


      <div
        id="loginMessage"
        class="login-message"
        role="alert"
        aria-live="polite"
      ></div>


      <div class="secure-note">
        <span>🔒</span>
        <span>
          Secure OTP verification powered by MSG91
        </span>
      </div>

    </section>

  </main>

  <script src="/login/login.js"></script>

</body>
</html>
