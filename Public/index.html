<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAJIGERLUDO - Official Gaming</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="logo-section">
      <span class="brand-title">BAJIGERLUDO</span>
      <span class="brand-sub">Official Gaming</span>
    </div>
    <div class="wallet-badge">
      <span>₹</span>
      <span id="user-balance">54.00</span>
    </div>
  </header>

  <!-- Banner -->
  <div class="notice-banner">
    🚀 Withdrawal 2 मिनट में होता है (Super Fast Withdrawal) ⏩
  </div>

  <main class="container">
    <!-- Create Battle Card -->
    <section class="card create-card">
      <h2>Create a Battle!</h2>
      <div class="input-group">
        <input type="number" id="battle-amount" placeholder="Enter Amount (e.g. 100)" min="10">
        <button id="btn-create" onclick="createBattle()">Set</button>
      </div>
    </section>

    <!-- Open Battles Section -->
    <section class="section">
      <h3 class="section-title">Open Battles</h3>
      <div id="open-battles-list" class="battle-list">
        <!-- Dynamic content will go here -->
        <div class="battle-card">
          <div class="battle-info">
            <span class="player-name">Challenge from <b>Jai bhona</b></span>
            <div class="battle-stats">
              <div class="stat"><small>ENTRY FEE</small> <span>₹50</span></div>
              <div class="stat"><small>PRIZE</small> <span class="prize-text">₹95</span></div>
            </div>
          </div>
          <button class="btn-play">Play</button>
        </div>
      </div>
    </section>

    <!-- Running Battles Section -->
    <section class="section">
      <h3 class="section-title">Running Battles</h3>
      <div id="running-battles-list" class="battle-list">
        <!-- Dynamic content will go here -->
        <div class="battle-card running">
          <div class="battle-vs">
            <span>Radhe</span> <span class="vs-badge">VS</span> <span>uVBty</span>
          </div>
          <div class="battle-stats">
            <div class="stat"><small>ENTRY FEE</small> <span>₹100</span></div>
            <div class="stat"><small>PRIZE</small> <span class="prize-text">₹190</span></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">🎮 Play</a>
    <a href="#" class="nav-item">👛 Wallet</a>
    <a href="#" class="nav-item">🎁 Refer</a>
    <a href="#" class="nav-item">🎧 Support</a>
    <a href="#" class="nav-item">👤 Profile</a>
  </nav>

  <script>
    // API Call - Create Battle
    async function createBattle() {
      const amount = document.getElementById('battle-amount').value;
      if (!amount || amount < 10) {
        alert("कम से कम ₹10 की राशि दर्ज करें।");
        return;
      }

      try {
        const res = await fetch('/api/battles/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: 'USER_ID_HERE', entryFee: Number(amount) })
        });
        const data = await res.json();
        if (data.success) {
          alert("बैटल बन गया!");
          location.reload();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert("कनेक्शन एरर!");
      }
    }
  </script>
</body>
</html>
