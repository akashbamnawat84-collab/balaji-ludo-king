<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Balaji Ludo King</title>

  <link
    rel="stylesheet"
    href="style.css">

</head>


<body>


  <!-- =========================
       TOP HEADER
  ========================= -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-name">
        BALAJI LUDO KING
      </div>

      <div class="brand-subtitle">
        LOGIN
      </div>

    </div>


    <nav class="top-nav">

      <button onclick="openWallet()">
        Wallet
      </button>

      <button onclick="openRefer()">
        Refer
      </button>

      <button onclick="openSupport()">
        Support
      </button>

      <button onclick="openProfile()">
        Profile
      </button>

    </nav>

  </header>



  <!-- =========================
       LOGIN PAGE
  ========================= -->

  <main>

    <section
      id="loginSection"
      class="card login-card">

      <div class="logo-area">

        <h1>
          BALAJI LUDO KING
        </h1>

      </div>


      <h2>
        Welcome Back
      </h2>


      <p class="login-subtitle">
        Enter your mobile number to get started
      </p>


      <!-- MOBILE NUMBER -->

      <div class="input-group">

        <label for="mobileNumber">
          Mobile Number
        </label>

        <input
          type="tel"
          id="mobileNumber"
          maxlength="10"
          inputmode="numeric"
          placeholder="98765 43210"
          autocomplete="tel">

      </div>


      <!-- SEND OTP -->

      <button
        type="button"
        class="primary-btn"
        onclick="sendOTP()">

        Send OTP

      </button>


      <div id="loginMessage"></div>


      <p class="security-text">
        Protected by end-to-end security protocol
      </p>

    </section>



    <!-- =========================
         OTP PAGE
    ========================= -->

    <section
      id="otpSection"
      class="card otp-card"
      style="display:none;">

      <h2>
        Verify OTP
      </h2>


      <p>
        Enter the OTP sent to your mobile number
      </p>


      <div class="input-group">

        <label for="otpInput">
          OTP
        </label>


        <input
          type="tel"
          id="otpInput"
          maxlength="6"
          inputmode="numeric"
          placeholder="Enter OTP"
          autocomplete="one-time-code">

      </div>


      <button
        type="button"
        class="primary-btn"
        onclick="verifyOTP()">

        Verify OTP

      </button>


      <button
        type="button"
        class="secondary-btn"
        onclick="backToLogin()">

        Back to Login

      </button>


      <div id="otpMessage"></div>

    </section>

  </main>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer class="footer">

    <div class="footer-title">
      Fun into Funds!
    </div>


    <div class="footer-text">

      For best experience, open
      <strong>BALAJI LUDO KING</strong>
      on chrome mobile

    </div>

  </footer>



  <!-- =========================
       BOTTOM NAVIGATION
  ========================= -->

  <nav class="bottom-nav">

    <button onclick="openWallet()">

      <span>₹</span>

      <small>
        Wallet
      </small>

    </button>


    <button onclick="openRefer()">

      <span>↗</span>

      <small>
        Refer
      </small>

    </button>


    <button onclick="openHome()">

      <span>⌂</span>

      <small>
        Home
      </small>

    </button>


    <button onclick="openSupport()">

      <span>🎧</span>

      <small>
        Support
      </small>

    </button>


    <button onclick="openProfile()">

      <span>👤</span>

      <small>
        Profile
      </small>

    </button>

  </nav>



  <!-- =========================
       LOGIN SCRIPT
  ========================= -->

  <script>

    let loginMobile = "";


    /* =========================
       SEND OTP
    ========================= */

    function sendOTP() {

      const input =
        document.getElementById(
          "mobileNumber"
        );

      const message =
        document.getElementById(
          "loginMessage"
        );


      const mobile =
        input.value.replace(/\D/g, "");


      if (mobile.length !== 10) {

        message.textContent =
          "Please enter a valid 10-digit mobile number.";

        return;

      }


      loginMobile = mobile;


      localStorage.setItem(
        "BALAJI_MOBILE",
        loginMobile
      );


      message.textContent =
        "OTP sent successfully.";


      document.getElementById(
        "loginSection"
      ).style.display = "none";


      document.getElementById(
        "otpSection"
      ).style.display = "block";

    }



    /* =========================
       VERIFY OTP
    ========================= */

    function verifyOTP() {

      const otp =
        document.getElementById(
          "otpInput"
        ).value.replace(/\D/g, "");


      const message =
        document.getElementById(
          "otpMessage"
        );


      if (otp.length !== 6) {

        message.textContent =
          "Please enter a valid 6-digit OTP.";

        return;

      }


      localStorage.setItem(
        "BALAJI_LOGIN",
        "true"
      );


      localStorage.setItem(
        "balajiLogin",
        "true"
      );


      localStorage.setItem(
        "balajiMobile",
        loginMobile
      );


      message.textContent =
        "Login successful.";


      /* =========================
         OPEN HOME PAGE
      ========================= */

      setTimeout(function () {

        window.location.href =
          "home.html";

      }, 500);

    }



    /* =========================
       BACK TO LOGIN
    ========================= */

    function backToLogin() {

      document.getElementById(
        "otpSection"
      ).style.display = "none";


      document.getElementById(
        "loginSection"
      ).style.display = "block";


      document.getElementById(
        "otpInput"
      ).value = "";


      document.getElementById(
        "otpMessage"
      ).textContent = "";

    }



    /* =========================
       HOME
    ========================= */

    function openHome() {

      window.location.href =
        "home.html";

    }



    /* =========================
       WALLET
    ========================= */

    function openWallet() {

      window.location.href =
        "wallet.html";

    }



    /* =========================
       REFER
    ========================= */

    function openRefer() {

      window.location.href =
        "refer.html";

    }



    /* =========================
       SUPPORT
    ========================= */

    function openSupport() {

      window.location.href =
        "support.html";

    }



    /* =========================
       PROFILE
    ========================= */

    function openProfile() {

      window.location.href =
        "profile.html";

    }

  </script>


</body>

</html>
