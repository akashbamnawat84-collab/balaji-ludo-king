<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balaji Ludo King</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #fbbf24;
    }

    .wallet {
      font-weight: bold;
      color: #22c55e;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
    }

    h2, h3 {
      margin-top: 0;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    input {
      background: #f8fafc;
      color: #111827;
    }

    button {
      background: #22c55e;
      color: white;
      font-weight: bold;
    }

    .orange {
      background: #f59e0b;
    }

    .red {
      background: #ef4444;
    }

    .blue {
      background: #3b82f6;
    }

    .hidden {
      display: none;
    }

    .room-code {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 5px;
      text-align: center;
      color: #fbbf24;
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .player {
      background: #334155;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .status {
      text-align: center;
      color: #fbbf24;
      margin-top: 12px;
    }

    .upload-box {
      border: 1px dashed #64748b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .bottom-nav {
      position: sticky;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      background: #1e293b;
      padding: 8px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .bottom-nav button {
      background: transparent;
      font-size: 12px;
      padding: 8px 2px;
      margin: 0;
    }

    .message {
      text-align: center;
      margin: 10px 0;
      color: #fbbf24;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="logo">👑 Balaji Ludo King</div>
    <div class="wallet">₹<span id="wallet">0</span></div>
  </div>
