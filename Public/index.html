<!-- ================= PROFILE SECTION ================= -->

<section id="profileSection" class="profile-page">

  <div class="profile-top">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2>Profile</h2>
  </div>

  <!-- PROFILE HEADER -->
  <div class="profile-header">

    <div class="profile-avatar">
      👤
    </div>

    <div class="profile-info">
      <h2 id="profileName">Player</h2>
      <p id="profileId">Player ID: --</p>
    </div>

    <button class="edit-profile-btn" onclick="editProfile()">
      ✏️
    </button>

    <div class="verified-badge">
      ✓ VERIFIED
    </div>

  </div>


  <!-- WALLET / BONUS -->
  <div class="balance-row">

    <div class="balance-card wallet-card">
      <div class="balance-icon">💳</div>
      <div>
        <span>Wallet Balance</span>
        <strong id="profileWallet">₹0.00</strong>
      </div>
    </div>

    <div class="balance-card bonus-card">
      <div class="balance-icon">🎁</div>
      <div>
        <span>Bonus</span>
        <strong id="profileBonus">₹0.00</strong>
      </div>
    </div>

  </div>


  <!-- STATISTICS -->
  <div class="stats-grid">

    <div class="stat-card battle">
      <div class="stat-icon">⚔️</div>
      <span>BATTLE PLAYED</span>
      <strong id="battlePlayed">0</strong>
    </div>

    <div class="stat-card coin">
      <div class="stat-icon">🪙</div>
      <span>COIN WON</span>
      <strong id="coinWon">₹0</strong>
    </div>

    <div class="stat-card referral">
      <div class="stat-icon">👥</div>
      <span>REFERRAL</span>
      <strong id="referralEarned">₹0</strong>
    </div>

    <div class="stat-card withdrawal">
      <div class="stat-icon">💸</div>
      <span>WITHDRAWAL</span>
      <strong id="withdrawalAmount">₹0</strong>
    </div>

  </div>


  <!-- ACCOUNT SETTINGS -->
  <div class="settings-card">

    <h2>ACCOUNT SETTINGS</h2>

    <div class="setting-item">
      <div class="setting-icon">📞</div>
      <div>
        <span>Phone Number</span>
        <strong id="profilePhone">Not Added</strong>
      </div>
    </div>

    <div class="setting-item">
      <div class="setting-icon">✉️</div>
      <div>
        <span>Email ID</span>
        <strong id="profileEmail">Not Added</strong>
      </div>

      <button onclick="editEmail()">✏️</button>
    </div>

    <div class="setting-item">
      <div class="setting-icon">🪪</div>
      <div>
        <span>KYC Status</span>
        <strong class="kyc-verified">
          ✓ Verified User
        </strong>
      </div>

      <span class="arrow">›</span>
    </div>

  </div>


  <!-- CUSTOMER ID -->
  <div class="customer-id-card">
    <span>Customer ID</span>
    <strong id="customerId">---</strong>
  </div>

</section>


<!-- ================= BOTTOM NAVIGATION ================= -->

<nav class="bottom-nav">

  <button onclick="openWallet()">
    <span>💳</span>
    <small>Wallet</small>
  </button>

  <button onclick="openRefer()">
    <span>🎁</span>
    <small>Refer</small>
  </button>

  <button class="home-nav" onclick="goHome()">
    <span>⌂</span>
  </button>

  <button onclick="openSupport()">
    <span>🎧</span>
    <small>Support</small>
  </button>

  <button class="active">
    <span>♙</span>
    <small>Profile</small>
  </button>

</nav>
