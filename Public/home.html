  <style>
    /* === BAJIGER THEME PATCH FOR ROOM === */
    body{background:#080d1f!important;color:#fff!important;font-family:Poppins,sans-serif}
    .topbar{background:#0a1026!important;border-bottom:2px solid #ffcc0020!important;padding:12px 5%!important}
    .brand-name{color:#ffcc00!important} .brand-sub{color:#fff!important}
    .card{background:#11172f!important;border:1px solid #ffcc0025!important;border-radius:16px!important;box-shadow:0 0 20px #ffcc0010}

    .info-box{background:#151e42!important;border:1px solid #ffffff10!important;border-radius:10px!important}

    .bottom-nav{background:#0a1026!important;border-top:1px solid #ffffff10!important}
    .bottom-nav a{color:#888!important} .bottom-nav a:hover{color:#ffcc00!important}
  </style>
