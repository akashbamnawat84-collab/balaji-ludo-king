<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Balaji Ludo King - Home</title>

  <link rel="stylesheet" href="home.css">
</head>

<body>

  <!-- TOP HEADER -->
  <header class="home-topbar">

    <div class="home-brand">
      BALAJI LUDO KING
    </div>

    <div class="home-subtitle">
      Official Gaming
    </div>

  </header>


  <!-- MAIN HOME -->
  <main class="home-container">

    <!-- WELCOME -->
    <section class="home-welcome">

      <div class="home-welcome-icon">
        🎮
      </div>

      <h1>
        Welcome Back 👋
      </h1>

      <p>
        Ready to play?
      </p>

    </section>


    <!-- GAME CARD -->
    <section class="home-game-card">

      <div class="game-icon">
        🎲
      </div>

      <div class="game-content">

        <h2>
          2 Player Ludo
        </h2>

        <p>
          Play a classic 2-player battle.
        </p>

      </div>

      <button
        type="button"
        class="home-play-btn"
        id="playNowBtn">

        Play Now

      </button>

    </section>


    <!-- QUICK OPTIONS -->
    <section class="home-options">

      <a
        href="refer/refer.html"
        class="home-option">

        <span class="option-icon">
          🎁
        </span>

        <span>
          Refer & Earn
        </span>

      </a>


      <button
        type="button"
        class="home-option home-option-button"
        id="walletBtn">

        <span class="option-icon">
          💰
        </span>

        <span>
          Wallet
        </span>

      </button>

    </section>

  </main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="home-bottom-nav">

    <a
      href="home.html"
      class="home-nav-item active">

      <span class="home-nav-icon">
        🏠
      </span>

      <span>
        Home
      </span>

    </a>


    <a
      href="refer/refer.html"
      class="home-nav-item">

      <span class="home-nav-icon">
        🎁
      </span>

      <span>
        Refer
      </span>

    </a>


    <button
      type="button"
      class="home-nav-item home-nav-button"
      id="walletNavBtn">

      <span class="home-nav-icon">
        💰
      </span>

      <span>
        Wallet
      </span>

    </button>


    <button
      type="button"
      class="home-nav-item home-nav-button"
      id="profileNavBtn">

      <span class="home-nav-icon">
        👤
      </span>

      <span>
        Profile
      </span>

    </button>

  </nav>


  <!-- HOME JAVASCRIPT -->
  <script src="home.js"></script>

</body>
        </html>
