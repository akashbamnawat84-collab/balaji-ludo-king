
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Balaji Ludo King</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .topbar {
      background: #ffffff;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #777;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 20px 15px 90px;
    }

    .welcome {
      background: #fff;
      border-radius: 16px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .welcome p {
      color: #777;
      font-size: 14px;
    }

    .game-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .game-card h3 {
      margin-bottom: 8px;
    }

    .game-card p {
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .play-btn {
      background: #ff7a00;
      color: white;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 5px;
    }

    .nav-item {
      text-align: center;
      font-size: 12px;
      color: #555;
      text-decoration: none;
    }

    .nav-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">BALAJI LUDO KING</div>
    <div class="subtitle">Official Gaming</div>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>Welcome Back 👋</h2>
      <p>Play Ludo and enjoy the game.</p>
    </section>

    <section class="game-card">
      <h3>🎮 2 Player Ludo</h3>
      <p>Play a classic 2-player battle.</p>

      <button class="btn play-btn" onclick="startGame()">
        Play Now
      </button>
    </section>

  </main>

  <nav class="bottom-nav">

    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      Home
    </a>

    <a href="refer.html" class="nav-item">
      <span class="nav-icon">🎁</span>
      Refer
    </a>

    <a href="#" class="nav-item">
      <span class="nav-icon">💰</span>
      Wallet
    </a>

    <a href="#" class="nav-item">
      <span class="nav-icon">👤</span>
      Profile
    </a>

  </nav>

  <script>
    function startGame() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
