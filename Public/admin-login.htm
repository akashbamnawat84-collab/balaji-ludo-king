<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Balaji Ludo King - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 390px;
            background: white;
            padding: 30px 24px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            margin-top: 7px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #374151;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:active {
            transform: scale(0.99);
        }

        .message {
            min-height: 20px;
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            color: #dc2626;
        }

        .security {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🎮</div>

        <h1>Balaji Ludo King</h1>

        <p class="subtitle">
            Secure Admin Login
        </p>

        <form id="loginForm">

            <label for="adminId">
                Admin ID
            </label>

            <input
                id="adminId"
                type="text"
                placeholder="Enter Admin ID"
                autocomplete="username"
                required
            >

            <label for="adminPassword">
                Password
            </label>

            <input
                id="adminPassword"
                type="password"
                placeholder="Enter Password"
                autocomplete="current-password"
                required
            >

            <button
                class="login-btn"
                type="submit"
            >
                Login
            </button>

        </form>

        <div
            id="message"
            class="message"
        ></div>

        <div class="security">
            🔒 Admin access only
        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();

            message.textContent =
                "Authentication will be connected securely on the server.";

        });

    </script>

</body>
</html>
