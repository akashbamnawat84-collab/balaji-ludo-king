<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balaji Ludo King - 2 Player</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="topbar">
      <h1>🎲 Balaji Ludo King</h1>
      <p>2 Player Battle</p>
    </header>

    <main class="container">

      <!-- Login -->
      <section class="welcome-card" id="welcomeCard">
        <h2>Welcome</h2>
        <p>Enter your name to continue</p>

        <input
          type="text"
          id="playerName"
          placeholder="Enter your name"
          maxlength="20"
        >

        <button id="startBtn">Continue</button>

        <p id="message"></p>
      </section>

      <!-- Room -->
      <section class="game-card" id="roomCard">

        <h2>🎮 2 Player Room</h2>

        <button id="createRoomBtn">
          Create Room
        </button>

        <div class="divider">OR</div>

        <input
          type="text"
          id="joinRoomInput"
          placeholder="Enter Room Code"
          maxlength="6"
        >

        <button id="joinRoomBtn">
          Join Room
        </button>

        <div class="room-info" id="roomInfo">
          <p>No room selected</p>
        </div>

      </section>

      <!-- Ludo Game -->
      <section class="ludo-card" id="ludoCard">

        <div class="game-header">
          <div>
            <span>Player 1</span>
            <strong id="player1Name">Waiting...</strong>
          </div>

          <div class="vs">VS</div>

          <div>
            <span>Player 2</span>
            <strong id="player2Name">Waiting...</strong>
          </div>
        </div>

        <div class="turn-info">
          <p id="turnText">Waiting for Player 2...</p>
        </div>

        <div class="ludo-board">

          <div class="home red-home">
            <span>🔴</span>
            <span>🔴</span>
            <span>🔴</span>
            <span>🔴</span>
          </div>

          <div class="path">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
          </div>

          <div class="center-home">
            🏆
          </div>

          <div class="home blue-home">
            <span>🔵</span>
            <span>🔵</span>
            <span>🔵</span>
            <span>🔵</span>
          </div>

        </div>

        <div class="dice-area">

          <div class="dice" id="dice">
            🎲
          </div>

          <button id="rollDiceBtn">
            Roll Dice
          </button>

          <p id="diceResult">
            Dice: -
          </p>

        </div>

      </section>

    </main>

    <footer>
      <p>© 2026 Balaji Ludo King</p>
    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
