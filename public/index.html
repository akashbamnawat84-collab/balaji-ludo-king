<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balaji Ludo King - 2 Player</title>

  <link rel="stylesheet" href="../new-style.css">
</head>

<body>

  <div class="container">

    <!-- Header -->
    <header class="card">
      <h1>🎲 Balaji Ludo King</h1>
      <p>2 Player Battle</p>
    </header>


    <!-- ========================= -->
    <!-- WELCOME -->
    <!-- ========================= -->

    <section class="card" id="welcomeCard">

      <h2>Welcome 👋</h2>

      <p>Enter your name to continue</p>

      <input
        type="text"
        id="playerName"
        placeholder="Enter your name"
        maxlength="20"
        autocomplete="name"
      >

      <button
        id="startBtn"
        class="primary-btn"
        type="button"
      >
        Continue
      </button>

      <p id="message" class="message"></p>

    </section>


    <!-- ========================= -->
    <!-- ROOM -->
    <!-- ========================= -->

    <section
      class="card hidden"
      id="roomCard"
    >

      <h2>🎮 2 Player Room</h2>

      <button
        id="createRoomBtn"
        class="primary-btn"
        type="button"
      >
        Create Room
      </button>

      <div class="message">OR</div>

      <input
        type="text"
        id="joinRoomInput"
        placeholder="Enter Room Code"
        maxlength="6"
        inputmode="numeric"
      >

      <button
        id="joinRoomBtn"
        class="secondary-btn"
        type="button"
      >
        Join Room
      </button>

      <div
        class="room-info"
        id="roomInfo"
      >
        <p>No room selected</p>
      </div>

    </section>


    <!-- ========================= -->
    <!-- LUDO GAME -->
    <!-- ========================= -->

    <section
      class="card hidden"
      id="ludoCard"
    >

      <!-- Players -->

      <div class="players">

        <div class="player">
          <small>Player 1</small>
          <h3 id="player1Name">
            Waiting...
          </h3>
        </div>

        <div class="player">
          <small>Player 2</small>
          <h3 id="player2Name">
            Waiting...
          </h3>
        </div>

      </div>


      <!-- Turn -->

      <div class="message">

        <p id="turnText">
          Waiting for Player 2...
        </p>

      </div>


      <!-- ========================= -->
      <!-- LUDO BOARD -->
      <!-- ========================= -->

      <div class="ludo-board">

        <!-- Red Home -->

        <div class="home red">
          🔴 🔴
          <br>
          🔴 🔴
        </div>


        <!-- Board Cells -->

        <div class="ludo-cell white"></div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell blue"></div>
        <div class="ludo-cell blue"></div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell white"></div>

        <div class="ludo-cell white"></div>
        <div class="ludo-cell safe">★</div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell safe">★</div>
        <div class="ludo-cell white"></div>

        <div class="ludo-cell yellow"></div>
        <div class="ludo-cell yellow"></div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell green"></div>
        <div class="ludo-cell green"></div>

        <div class="ludo-cell white"></div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell safe">★</div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell safe">★</div>

        <div class="ludo-cell blue"></div>
        <div class="ludo-cell blue"></div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell red"></div>
        <div class="ludo-cell red"></div>

        <div class="ludo-cell white"></div>
        <div class="ludo-cell safe">★</div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell white"></div>
        <div class="ludo-cell safe">★</div>
        <div class="ludo-cell white"></div>


        <!-- Center -->

        <div class="center-home">
          🏆
        </div>

      </div>


      <!-- ========================= -->
      <!-- DICE -->
      <!-- ========================= -->

      <div class="card">

        <div
          class="dice"
          id="dice"
        >
          🎲
        </div>

        <button
          id="rollDiceBtn"
          class="primary-btn"
          type="button"
        >
          Roll Dice
        </button>

        <p
          id="diceResult"
          class="message"
        >
          Dice: -
        </p>

      </div>

    </section>


    <!-- Footer -->

    <footer>
      <p>© 2026 Balaji Ludo King</p>
    </footer>

  </div>


  <!-- ONLY ONE JavaScript file -->

  <script src="../script.js"></script>

</body>
</html>
